name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Image tag or commit (see the startup log line "starting yandex-iap").
    validations:
      required: true
  - type: dropdown
    id: proxy
    attributes:
      label: Reverse proxy
      options: [Traefik, nginx (auth_request), Caddy (forward_auth), HAProxy, Envoy, Kubernetes ingress-nginx, Other]
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Relevant configuration
      description: Environment variables and proxy rules. **Remove secrets** (client secret, cookie secret).
      render: shell
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: JSON log lines around the problem. Remove emails you do not want to share.
      render: json
